<script>
  /* the theme before the first paint: system unless the person chose one. Setpiece keys win, older OpenFilm keys
     are read as a fallback so an existing person's appearance is never lost. */
  (function () {
    var t = 'system';
    try { t = localStorage.getItem('setpiece.theme') || localStorage.getItem('openfilm.theme') || 'system'; } catch (e) {}
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
  })();
</script>
