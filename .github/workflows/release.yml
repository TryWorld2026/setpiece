name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, such as v0.3.2
        required: true
      unsigned_preview:
        description: Build an unsigned macOS and Windows preview instead of the signed release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  signing:
    name: Check signing credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required secrets
        id: check
        shell: bash
        env:
          SETPIECE_SIGN_IDENTITY: ${{ secrets.SETPIECE_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          missing=0
          for name in SETPIECE_SIGN_IDENTITY APPLE_TEAM_ID APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_NOTARY_APPLE_ID APPLE_NOTARY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set; the signed desktop build will be skipped"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS signed installers
    needs: signing
    if: needs.signing.outputs.ready == 'true' && inputs.unsigned_preview != true
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      SETPIECE_SIGN_IDENTITY: ${{ secrets.SETPIECE_SIGN_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
      SETPIECE_NOTARY_PROFILE: setpiece-notary
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify signing secrets
        shell: bash
        run: |
          missing=0
          for name in SETPIECE_SIGN_IDENTITY APPLE_TEAM_ID APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_NOTARY_APPLE_ID APPLE_NOTARY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              missing=1
            fi
          done
          exit "$missing"
      - name: Install the Developer ID certificate
        shell: bash
        run: |
          export KEYCHAIN_PATH="$RUNNER_TEMP/setpiece-signing.keychain-db"
          export KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          python3 - "$RUNNER_TEMP/setpiece-certificate.p12" <<'PY'
          import base64
          import os
          import pathlib
          import sys
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE_P12"].strip()))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/setpiece-certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/setpiece-certificate.p12"
      - name: Store notarization credentials
        shell: bash
        run: |
          xcrun notarytool store-credentials "$SETPIECE_NOTARY_PROFILE" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD"
      - run: pnpm install --frozen-lockfile
      - name: Build the signed and notarized macOS apps
        shell: bash
        run: |
          pnpm --filter setpiece-desktop release --arch=arm64 --official
          pnpm --filter setpiece-desktop release --arch=x64 --official
      - name: Name the macOS feed files by architecture
        shell: bash
        run: |
          for arch in arm64 x64; do
            feed="apps/desktop/.release/$arch/out/latest-mac.yml"
            if [ -f "$feed" ]; then
              cp "$feed" "apps/desktop/.release/$arch/out/latest-mac-$arch.yml"
            fi
          done
      - name: Verify macOS signatures and notarization
        shell: bash
        run: |
          codesign --verify --deep --strict "apps/desktop/.release/arm64/out/mac-arm64/Setpiece.app"
          codesign --verify --deep --strict "apps/desktop/.release/x64/out/mac/Setpiece.app"
          for dmg in apps/desktop/.release/arm64/out/Setpiece-arm64.dmg apps/desktop/.release/x64/out/Setpiece-x64.dmg; do
            spctl -a -t open --context context:primary-signature -v "$dmg"
          done
      - name: Remove the temporary keychain
        if: always()
        shell: bash
        run: security delete-keychain "$KEYCHAIN_PATH" || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          if-no-files-found: error
          path: |
            apps/desktop/.release/arm64/out/*.dmg
            apps/desktop/.release/arm64/out/*.zip
            apps/desktop/.release/arm64/out/latest-mac-arm64.yml
            apps/desktop/.release/x64/out/*.dmg
            apps/desktop/.release/x64/out/*.zip
            apps/desktop/.release/x64/out/latest-mac-x64.yml

  windows:
    name: Windows signed installer
    needs: signing
    if: needs.signing.outputs.ready == 'true' && inputs.unsigned_preview != true
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify signing secrets
        shell: pwsh
        run: |
          $missing = @()
          foreach ($name in @('WIN_CSC_LINK', 'WIN_CSC_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Host "::error::$name is not set"
              $missing += $name
            }
          }
          if ($missing.Count) { exit 1 }
      - run: pnpm install --frozen-lockfile
      - name: Build the signed Windows installer
        shell: pwsh
        run: pnpm --filter setpiece-desktop release --platform=win --arch=x64 --official
      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $files = @(
            'apps\desktop\.release\win-x64\out\Setpiece-Setup-x64.exe',
            'apps\desktop\.release\win-x64\out\win-unpacked\Setpiece.exe'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "$file was not built" }
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            Write-Host "$file : $($signature.Status) : $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$file is not validly signed" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          path: |
            apps/desktop/.release/win-x64/out/*.exe
            apps/desktop/.release/win-x64/out/*.blockmap
            apps/desktop/.release/win-x64/out/*.yml

  publish:
    name: Draft GitHub release
    needs: [signing, macos, windows]
    if: needs.signing.outputs.ready == 'true' && inputs.unsigned_preview != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-installers
          path: dist/macos
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: dist/windows
          merge-multiple: true
      - name: Checksums
        run: |
          find dist -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          mapfile -d '' files < <(find dist -type f -print0)
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${files[@]}" \
              --draft \
              --generate-notes \
              --title "Setpiece $tag" \
              -R "$GITHUB_REPOSITORY"
          fi

  preview-macos:
    name: macOS unsigned preview
    if: inputs.unsigned_preview == true
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the unsigned Apple Silicon preview
        run: pnpm --filter setpiece-desktop release --arch=arm64 --preview --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: preview-macos-arm64
          if-no-files-found: error
          path: |
            apps/desktop/.release/arm64/out/*.dmg
            apps/desktop/.release/arm64/out/*.zip
      - name: Build the unsigned Intel Mac preview
        run: pnpm --filter setpiece-desktop release --arch=x64 --preview --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: preview-macos-x64
          if-no-files-found: error
          path: |
            apps/desktop/.release/x64/out/*.dmg
            apps/desktop/.release/x64/out/*.zip

  preview-windows:
    name: Windows x64 unsigned preview
    if: inputs.unsigned_preview == true
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the unsigned Windows preview
        shell: pwsh
        run: pnpm --filter setpiece-desktop release --platform=win --arch=x64 --preview --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: preview-windows-x64
          if-no-files-found: error
          path: apps/desktop/.release/win-x64/out/*.exe

  preview-publish:
    name: Publish unsigned preview release
    needs: [preview-macos, preview-windows]
    if: inputs.unsigned_preview == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-macos-arm64
          path: dist/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: preview-macos-x64
          path: dist/macos-x64
      - uses: actions/download-artifact@v4
        with:
          name: preview-windows-x64
          path: dist/windows-x64
      - name: Checksums
        run: |
          find dist -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - name: Create the GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Setpiece / 造境 **0.3.2 Desktop Preview**，macOS 与 Windows 未签名安装包。

          三个平台均由当前重设计代码构建：Apple Silicon、Intel Mac 与 Windows x64。包括 Finder 式项目库、新的编辑器工作台、检查器和 AI 助理界面。

          - macOS 13+ · Apple Silicon：DMG / ZIP
          - macOS 13+ · Intel：DMG / ZIP
          - Windows 10 / 11 · x64：EXE
          - 所有安装包均未签名；macOS 首次打开可能被 Gatekeeper 阻止，Windows SmartScreen 可能提示“未知发布者”

          这是预发布版本，不会替换稳定版 Latest。Setpiece 是 OpenFilm 的独立商业衍生版，遵循 MIT License；上游版权与许可声明见仓库中的 LICENSE、LICENSES/OpenFilm-MIT.txt 与 NOTICE.md。
          EOF
          mapfile -d '' files < <(find dist -type f -print0)
          gh release create "$TAG" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Setpiece Preview 0.3.2 · macOS + Windows" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            -R "$GITHUB_REPOSITORY"
