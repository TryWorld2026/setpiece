<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setpiece · 造境</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23F6F4EF%22%2F%3E%3Crect%20x%3D%2215%22%20y%3D%2215%22%20width%3D%2234%22%20height%3D%2234%22%20rx%3D%224%22%20fill%3D%22none%22%20stroke%3D%22%23242629%22%20stroke-width%3D%225%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%225%22%20fill%3D%22%236F879C%22%2F%3E%3C%2Fsvg%3E">
<script>
  /* the theme before the first paint, so the wrong one never flashes: dark unless the person chose another */
  (function () {
    var t = 'dark';
    try { t = localStorage.getItem('setpiece.theme') || localStorage.getItem('openfilm.theme') || 'dark'; } catch (e) {}
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
  })();
</script>
</head>
<body>
<div id="root"></div>
<!-- the chat's column beside Studio (the panel Studio leaves room for), and its layer for what floats. Both are
     Studio's host panel (its keys leave them alone) and take focus: a click anywhere in the chat, not only in its
     fields, keeps the keyboard in the chat (Space, Delete, ⌘A there never reach Studio). -->
<div id="of-chat" class="of-chat" data-studio-host-panel tabindex="-1"></div>
<div id="of-chat-layer" class="of-chat" data-studio-host-panel tabindex="-1"></div>
<script type="module" src="./main.tsx"></script>
</body>
</html>
